<style>
:root{
  --bg:#14161b; --card:#1b1e25; --line:#2b3038; --ink:#e8eaed; --dim:#9aa2ad;
  --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --accent:#60a5fa;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f6f7f9; --card:#fff; --line:#e2e5ea; --ink:#1a1d23; --dim:#666e7a;
         --good:#15803d; --warn:#b45309; --bad:#b91c1c; --accent:#1d4ed8; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
a{color:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px 0}
header .wrap{padding:0 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:600}
.muted{color:var(--dim);font-size:12px}
.grow{flex:1}
button,select,input{font:inherit;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button{cursor:pointer}
button.on{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.45;cursor:default}

/* ---- gate ---- */
#gate{max-width:380px;margin:14vh auto;padding:22px;background:var(--card);
  border:1px solid var(--line);border-radius:14px}
#gate h2{margin:0 0 6px;font-size:18px}
#gate p{color:var(--dim);font-size:13px;margin:0 0 14px}
#gate input{width:100%;margin-bottom:10px}
#gate button{width:100%;background:var(--accent);color:#fff;border-color:var(--accent);
  padding:10px}
#err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}

/* ---- cards ---- */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px;position:relative}
.card h3{margin:0;font-size:15px;font-weight:600}
.card .sub{color:var(--dim);font-size:12.5px;margin:2px 0 9px}
.score{position:absolute;top:12px;right:12px;text-align:right}
.fit{font-size:20px;font-weight:700;line-height:1}
.facts{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:13px;margin-bottom:9px}
.facts b{font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.pill{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);
  color:var(--dim);white-space:nowrap}
.pill.good{color:var(--good);border-color:currentColor}
.pill.bad{color:var(--bad);border-color:currentColor}
.pill.warn{color:var(--warn);border-color:currentColor}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row a{font-size:12.5px;text-decoration:none;border:1px solid var(--line);
  border-radius:7px;padding:4px 9px}
.card.pick{outline:2px solid var(--accent)}

/* ---- detail ---- */
#detail{display:none}
#detail.show{display:block}
#list.hide{display:none}
.back{margin-bottom:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:15px;margin-bottom:12px}
.panel h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;
  letter-spacing:.05em;color:var(--dim);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:13.5px}
.kv span:nth-child(even){font-variant-numeric:tabular-nums;font-weight:600}

/* ---- compare ---- */
#compare{display:none}
#compare.show{display:block}
.cmp{overflow-x:auto}
.cmp table{min-width:520px}
.best{color:var(--good);font-weight:700}

@media print{
  header,.row a,#controls,.printhide{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .panel,.card{border:1px solid #999;break-inside:avoid;background:#fff}
  .grid{display:block}
  .card{margin-bottom:8pt}
  a{color:#000;text-decoration:none}
  a[href^="http"]:after{content:" (" attr(href) ")";font-size:8pt;color:#555}
}

<script id="meta" type="application/json">{"generated_at":"2026-09-03T14:51:30+00:00","count":300,"site_url":"https://morphew.dev/house"}</script>
<script>
(function(){
"use strict";
var ENV  = JSON.parse(document.getElementById("payload").textContent);
var META = JSON.parse(document.getElementById("meta").textContent);
var KEYNAME = "ha.pass.v1";
var DATA = null, VIEW = "all", SORT = "fit", PICKS = [];

function $(id){ return document.getElementById(id); }
function b64(s){ var raw=atob(s), a=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) a[i]=raw.charCodeAt(i); return a; }

/* ---------- decryption ---------- */
async function unlock(pass){
  if(!window.crypto || !crypto.subtle)
    throw new Error("This browser will not decrypt over an insecure connection. "+
                    "Open the https:// link.");
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2",
                                           false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(ENV.salt), iterations:ENV.iterations, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  /* A wrong passphrase fails here, in the GCM tag check -- there is no way to
     get partial or plausible-looking output out of it. */
  var plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(ENV.iv) },
                                          key, b64(ENV.ct));
  if(ENV.compression === "gzip"){
    /* Compressed before encryption, because ciphertext is noise and gzip on the
       wire does nothing for it. Costs ~550 KB of mobile data not to. */
    if(typeof DecompressionStream === "undefined")
      throw new Error("BROWSER: this browser is too old to read the page "+
        "(needs DecompressionStream — Safari 16.4+, Chrome 80+, Firefox 113+).");
    var stream = new Blob([plain]).stream()
                   .pipeThrough(new DecompressionStream("gzip"));
    plain = await new Response(stream).arrayBuffer();
  }
  return JSON.parse(new TextDecoder().decode(plain));
}

async function attempt(pass, remember){
  $("err").textContent = "Decrypting…";
  try{
    DATA = await unlock(pass);
  }catch(e){
    /* Distinguish "wrong passphrase" from "this browser cannot do it". Telling
       someone their passphrase is wrong when it is not sends them looking in
       exactly the wrong place. */
    var msg = (e && e.message) || "";
    $("err").textContent =
        (msg.indexOf("insecure")>-1 || msg.indexOf("BROWSER:")>-1)
          ? msg.replace("BROWSER: ","")
          : "That passphrase does not open this page.";
    try{ localStorage.removeItem(KEYNAME); }catch(_){}
    return false;
  }
  if(remember){ try{ localStorage.setItem(KEYNAME, pass); }catch(_){} }
  $("gate").style.display = "none";
  $("app").hidden = false;
  start();
  return true;
}

/* ---------- formatting ---------- */
function money(v){ return (v===null||v===undefined||v==="") ? "—"
  : "$" + Math.round(v).toLocaleString("en-US"); }
function num(v, suffix){ return (v===null||v===undefined||v==="") ? "—"
  : Math.round(v).toLocaleString("en-US") + (suffix||""); }
/* Years are not quantities. toLocaleString turns 2020 into "2,020", which reads
   as a typo and undermines every other number on the page. */
function year(v){ return (v===null||v===undefined||v==="") ? "—" : String(Math.round(v)); }
function esc(s){ return String(s===null||s===undefined?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;"); }
function label(id){ return String(id||"").replace(/_/g," "); }

function fitColor(v){ return v>=80 ? "var(--good)" : v>=65 ? "var(--warn)" : "var(--dim)"; }

/* ---------- views ---------- */
function inView(p){
  if(VIEW==="all") return true;
  if(VIEW==="new") return p.year && p.year >= 2021;
  if(VIEW==="ok")  return p.commute_work!=null && p.commute_parents!=null
                       && p.commute_work<=40 && p.commute_parents<=20;
  if(VIEW==="watch") return p.ustate==="watching" || p.ustate==="interested";
  return true;
}
function sorted(list){
  var k = { fit:function(p){return -(p.fit||0);},
            price:function(p){return p.price==null? 1e12 : p.price;},
            monthly:function(p){return p.true_monthly==null? 1e12 : p.true_monthly;},
            year:function(p){return p.year==null? 1e12 : -p.year;},
            work:function(p){return p.commute_work==null? 1e12 : p.commute_work;},
            parents:function(p){return p.commute_parents==null? 1e12 : p.commute_parents;}
          }[SORT];
  /* Unknowns sort LAST rather than first, in every order. A house with no price
     is not the cheapest one. */
  return list.slice().sort(function(a,b){ return k(a)-k(b); });
}

function card(p){
  var pills = [];
  if(p.year && p.year>=2021) pills.push('<span class="pill good">'+p.year+' build</span>');
  else if(p.year) pills.push('<span class="pill">'+p.year+'</span>');
  if(p.ustate==="watching") pills.push('<span class="pill warn">watching</span>');
  if(p.ustate==="interested") pills.push('<span class="pill good">interested</span>');
  if(p.district) pills.push('<span class="pill">'+esc(p.district)+'</span>');
  (p.wins||[]).slice(0,2).forEach(function(w){
    pills.push('<span class="pill good">'+esc(label(w))+'</span>'); });
  (p.losses||[]).slice(0,1).forEach(function(w){
    pills.push('<span class="pill bad">'+esc(label(w))+'</span>'); });

  var L = p.links || {};
  var linkRow = ["zillow","realtor","maps"].filter(function(k){return L[k];})
    .map(function(k){ return '<a href="'+esc(L[k])+'" target="_blank" rel="noopener noreferrer">'
      + k.charAt(0).toUpperCase()+k.slice(1) + '</a>'; }).join("");

  return '<div class="card" data-id="'+p.id+'">'
    + '<div class="score"><div class="fit" style="color:'+fitColor(p.fit)+'">'
      + (p.fit==null?"—":p.fit.toFixed(0)) + '</div>'
      + '<div class="muted">'+ (p.confidence==null?"":p.confidence.toFixed(0)+"% conf") +'</div></div>'
    + '<h3>'+esc(p.address)+'</h3>'
    + '<div class="sub">'+esc(p.city||"")+' '+esc(p.zip||"")+'</div>'
    + '<div class="facts"><b>'+money(p.price)+'</b>'
      + '<span>'+num(p.beds)+' bd</span><span>'+num(p.baths)+' ba</span>'
      + '<span>'+num(p.sqft)+' sqft</span>'
      + '<span title="true monthly, all-in">'+money(p.true_monthly)+'/mo</span></div>'
    + '<div class="facts muted"><span>work '+num(p.commute_work," min")+'</span>'
      + '<span>parents '+num(p.commute_parents," min")+'</span></div>'
    + '<div class="pills">'+pills.join("")+'</div>'
    + '<div class="row">'+linkRow
      + '<span class="grow"></span>'
      + '<button class="pickbtn" data-pick="'+p.id+'">Compare</button></div>'
    + '</div>';
}

function renderList(){
  var list = sorted(DATA.properties.filter(inView));
  $("grid").innerHTML = list.length
    ? list.map(card).join("")
    : '<p class="muted">Nothing matches this view.</p>';
  document.querySelectorAll(".card").forEach(function(el){
    if(PICKS.indexOf(+el.dataset.id)>-1) el.classList.add("pick");
    el.addEventListener("click", function(ev){
      if(ev.target.closest("a") || ev.target.closest("button")) return;
      location.hash = "p" + el.dataset.id;
    });
  });
  document.querySelectorAll(".pickbtn").forEach(function(b){
    b.addEventListener("click", function(ev){
      ev.stopPropagation(); togglePick(+b.dataset.pick);
    });
  });
}

function togglePick(id){
  var at = PICKS.indexOf(id);
  if(at>-1) PICKS.splice(at,1);
  else if(PICKS.length<4) PICKS.push(id);
  $("cmpbtn").disabled = PICKS.length<2;
  $("cmpbtn").textContent = PICKS.length ? "Compare ("+PICKS.length+")" : "Compare";
  renderList();
}

function byId(id){
  return DATA.properties.filter(function(p){ return p.id===id; })[0]; }

function detail(id){
  var p = byId(id);
  if(!p){ location.hash=""; return; }
  var L = p.links || {};
  var linkRow = Object.keys(L).map(function(k){
    return '<a href="'+esc(L[k])+'" target="_blank" rel="noopener noreferrer">'
      + k.charAt(0).toUpperCase()+k.slice(1)+'</a>'; }).join("");

  /* Positional rows: [id, tier, utility, weight, contribution]. Keyed objects
     cost more in the ciphertext than the numbers did. */
  var comps = (p.scored||[]).slice().sort(function(a,b){
    return (b[4]||0)-(a[4]||0); });
  var rows = comps.map(function(c){
    var pct = Math.round((c[2]||0)*100);
    /* c[5] is the note, and it is the whole reason this column exists: a value
       we assumed must never look like a value we know. */
    var note = c[5] ? '<div class="muted" style="font-size:11.5px">'
                        + esc(c[5]) + '</div>' : '';
    return '<tr><td>'+esc(label(c[0]))+note+'</td>'
      + '<td class="muted">'+esc(c[1]||"")+'</td>'
      + '<td><div class="bar"><i style="width:'+pct+'%"></i></div></td>'
      + '<td class="n">'+pct+'%</td>'
      + '<td class="n">'+(c[4]==null?"—":c[4].toFixed(1))+'</td></tr>';
  }).join("");

  var unknown = (p.unknown||[]);

  $("detail").innerHTML =
      '<div class="back"><button onclick="location.hash=\'\'">&larr; All houses</button> '
    + '<button onclick="window.print()" class="printhide">Print tour sheet</button></div>'
    + '<div class="panel"><h4>'+esc(p.city||"")+' '+esc(p.zip||"")+'</h4>'
      + '<h2 style="margin:0 0 10px">'+esc(p.address)+'</h2>'
      + '<div class="kv">'
      + '<span>Fit</span><span style="color:'+fitColor(p.fit)+'">'
        + (p.fit==null?"—":p.fit.toFixed(1))+'</span>'
      + '<span>Confidence</span><span>'+(p.confidence==null?"—":p.confidence.toFixed(0)+"%")+'</span>'
      + '<span>List price</span><span>'+money(p.price)+'</span>'
      + '<span>Beds / baths</span><span>'+num(p.beds)+' / '+num(p.baths)+'</span>'
      + '<span>Square feet</span><span>'+num(p.sqft)+'</span>'
      + '<span>Year built</span><span>'+year(p.year)+'</span>'
      + '<span>Days on market</span><span>'+num(p.true_dom)+'</span>'
      + '</div><div class="row" style="margin-top:12px">'+linkRow+'</div></div>'

    + '<div class="panel"><h4>What it costs a month</h4><div class="kv">'
      + '<span><b>True monthly, all in</b></span><span>'+money(p.true_monthly)+'</span>'
      + '<span>PITI</span><span>'+money(p.piti)+'</span>'
      + '<span>HOA</span><span>'+money(p.hoa)+'</span>'
      + '<span>Cash to close</span><span>'+money(p.cash_to_close)+'</span>'
      + '<span>DTI</span><span>'+(p.dti==null?"—":(p.dti*100).toFixed(0)+"%")+'</span>'
      + '</div></div>'

    + '<div class="panel"><h4>Getting around</h4><div class="kv">'
      + '<span>Nhi’s drive to the courthouse</span><span>'+num(p.commute_work," min")+'</span>'
      + '<span>Drive to Jack’s parents</span><span>'+num(p.commute_parents," min")+'</span>'
      + '</div></div>'

    + '<div class="panel"><h4>Schools</h4><div class="kv">'
      + '<span>District</span><span>'+esc(p.district||"—")+'</span>'
      + '<span>Elementary</span><span>'+esc(p.elementary||"—")+'</span>'
      + '<span>Middle</span><span>'+esc(p.middle||"—")+'</span>'
      + '<span>High</span><span>'+esc(p.high||"—")+'</span>'
      + '</div></div>'

    + '<div class="panel"><h4>Why it scored what it scored</h4>'
      + '<table><tr><th>Criterion</th><th>Tier</th><th></th><th class="n">Match</th>'
      + '<th class="n">Points</th></tr>'+rows+'</table>'
      + (unknown.length ? '<p class="muted" style="margin:10px 0 0"><b>'
          + unknown.length + ' had no data:</b> '
          + unknown.map(function(u){return esc(label(u));}).join(", ")
          + '. They were skipped, not counted against it — a house is never '
          + 'marked down for what we failed to find out. That is what the '
          + 'confidence figure is telling you.</p>' : '')
      + '</div>'
    + (p.notes ? '<div class="panel"><h4>Notes</h4><p>'+esc(p.notes)+'</p></div>' : '');
}

function compare(){
  var picked = PICKS.map(byId).filter(Boolean);
  if(picked.length<2){ location.hash=""; return; }
  var rows = [
    ["Fit", function(p){return p.fit;}, "high", function(v){return v==null?"—":v.toFixed(1);}],
    ["Price", function(p){return p.price;}, "low", money],
    ["True monthly", function(p){return p.true_monthly;}, "low", money],
    ["Cash to close", function(p){return p.cash_to_close;}, "low", money],
    ["Sqft", function(p){return p.sqft;}, "high", function(v){return num(v);}],
    ["$/sqft", function(p){return (p.price&&p.sqft)? p.price/p.sqft : null;}, "low",
      function(v){return v==null?"—":"$"+v.toFixed(0);}],
    ["Year built", function(p){return p.year;}, "high", year],
    ["Work commute", function(p){return p.commute_work;}, "low",
      function(v){return num(v," min");}],
    ["Parents", function(p){return p.commute_parents;}, "low",
      function(v){return num(v," min");}],
    ["Beds", function(p){return p.beds;}, "high", function(v){return num(v);}],
    ["Confidence", function(p){return p.confidence;}, "high",
      function(v){return v==null?"—":v.toFixed(0)+"%";}]
  ];
  var head = '<tr><th></th>' + picked.map(function(p){
    return '<th>'+esc(p.address)+'<div class="muted">'+esc(p.city||"")+'</div></th>';
  }).join("") + '</tr>';

  var body = rows.map(function(r){
    var vals = picked.map(r[1]);
    var known = vals.filter(function(v){ return v!=null; });
    /* Two things have to be true before anything is marked a winner:
         - more than one house actually has the value. Highlighting the only
           house whose price we happen to know is a lie dressed as analysis.
         - the values are not all identical. Three houses with four bedrooms
           each does not have a "best" one, and painting all three green teaches
           the reader to ignore the colour. */
    var spread = {};
    known.forEach(function(v){ spread[v]=1; });
    var comparable = known.length>1 && Object.keys(spread).length>1;
    var best = comparable ? (r[2]==="high" ? Math.max.apply(null,known)
                                           : Math.min.apply(null,known)) : null;
    return '<tr><th>'+r[0]+'</th>' + vals.map(function(v){
      var win = (best!=null && v!=null && v===best);
      return '<td class="n'+(win?" best":"")+'">'+r[3](v)+'</td>';
    }).join("") + '</tr>';
  }).join("");

  $("compare").innerHTML =
      '<div class="back"><button onclick="location.hash=\'\'">&larr; All houses</button> '
    + '<button onclick="window.print()" class="printhide">Print</button></div>'
    + '<div class="panel cmp"><table>'+head+body+'</table></div>';
}

/* ---------- routing ---------- */
function route(){
  var hash = location.hash.replace("#","");
  var showDetail = /^p\d+$/.test(hash), showCompare = hash==="compare";
  $("list").classList.toggle("hide", showDetail||showCompare);
  $("detail").classList.toggle("show", showDetail);
  $("compare").classList.toggle("show", showCompare);
  if(showDetail) detail(+hash.slice(1));
  else if(showCompare) compare();
  else renderList();
  window.scrollTo(0,0);
}

function start(){
  var when = DATA.generated_at ? new Date(DATA.generated_at) : null;
  $("stamp").textContent = DATA.properties.length + " houses · as of "
    + (when && !isNaN(when) ? when.toLocaleString([], {month:"short", day:"numeric",
        hour:"numeric", minute:"2-digit"}) : "unknown");
  document.querySelectorAll("[data-view]").forEach(function(b){
    b.addEventListener("click", function(){
      VIEW = b.dataset.view;
      document.querySelectorAll("[data-view]").forEach(function(o){
        o.classList.toggle("on", o===b); });
      if(location.hash) location.hash=""; else renderList();
    });
  });
  $("sort").addEventListener("change", function(){ SORT=$("sort").value; renderList(); });
  $("cmpbtn").addEventListener("click", function(){ location.hash="compare"; });
  $("lock").addEventListener("click", function(){
    try{ localStorage.removeItem(KEYNAME); }catch(_){}
    location.reload();
  });
  window.addEventListener("hashchange", route);
  route();
}

/* ---------- boot ---------- */
$("go").addEventListener("click", function(){ attempt($("pass").value, true); });
$("pass").addEventListener("keydown", function(e){
  if(e.key==="Enter") attempt($("pass").value, true); });

var saved = null;
try{ saved = localStorage.getItem(KEYNAME); }catch(_){}
if(saved){ attempt(saved, true); }
else { $("pass").focus(); }
